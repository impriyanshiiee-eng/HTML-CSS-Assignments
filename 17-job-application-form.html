
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Job application form using HTML input types">
  <title>Job Application Form</title>
</head>

<body>

  <header>
    <h1>Job Application – Front-End Developer</h1>
    <p>Please complete the form to apply for this position.</p>
  </header>

  <main>
    <form action="#" method="post" enctype="multipart/form-data">

      <fieldset>
        <legend>Personal Details</legend>

        <p>
          <label for="fn">Full Name:</label>
          <input type="text" id="fn" name="fullname"
            placeholder="Enter your full name" required>
        </p>

        <p>
          <label for="em">Email:</label>
          <input type="email" id="em" name="email"
            placeholder="Enter your email" required>
        </p>

        <p>
          <label for="ph">Phone:</label>
          <input type="tel" id="ph" name="phone"
            placeholder="Enter phone number">
        </p>

        <p>
          <label for="dob">Date of Birth:</label>
          <input type="date" id="dob" name="dob">
        </p>

        <p>
          <label for="web">Portfolio URL:</label>
          <input type="url" id="web" name="website"
            placeholder="https://example.com">
        </p>

        <p>
          <label for="pw">Create Password:</label>
          <input type="password" id="pw" name="password"
            minlength="8" required>
        </p>
      </fieldset>

      <fieldset>
        <legend>Job Details</legend>

        <p>
          <label for="pos">Position:</label>
          <select id="pos" name="position" required>
            <option value="">-- Select Position --</option>
            <option value="frontend">Front-End Developer</option>
            <option value="designer">UI Designer</option>
            <option value="tester">QA Tester</option>
          </select>
        </p>

        <p>
          <label for="join">Earliest Joining Date:</label>
          <input type="date" id="join" name="join">
        </p>

        <p>
          <label for="slot">Interview Slot:</label>
          <input type="datetime-local" id="slot" name="slot">
        </p>

        <p>
          <label for="mo">Preferred Start Month:</label>
          <input type="month" id="mo" name="month">
        </p>

        <p>
          <label for="wk">Preferred Week:</label>
          <input type="week" id="wk" name="week">
        </p>

        <p>
          <label for="tm">Best Call Time:</label>
          <input type="time" id="tm" name="time">
        </p>

        <p>
          <label for="exp">Years of Experience:</label>
          <input type="number" id="exp" name="experience"
            min="0" max="40" value="0">
        </p>

        <p>
          <label for="sal">Expected Salary (₹ LPA):</label>
          <input type="range" id="sal" name="salary"
            min="2" max="30" value="6"
            oninput="salaryOutput.value = this.value">
          <output id="salaryOutput">6</output>
        </p>

        <p>
          <label for="col">Favourite Colour:</label>
          <input type="color" id="col" name="colour"
            value="#3366ff">
        </p>

        <p>
          <label for="sk">Skills:</label>
          <input list="skills" id="sk" name="skill">

          <datalist id="skills">
            <option value="HTML">
            <option value="CSS">
            <option value="JavaScript">
            <option value="Git">
          </datalist>
        </p>

        <p>
          <label for="search">Search Company Policy:</label>
          <input type="search" id="search" name="search">
        </p>
      </fieldset>

      <fieldset>
        <legend>Work Mode</legend>

        <label>
          <input type="radio" name="mode" value="onsite">
          On-site
        </label>

        <label>
          <input type="radio" name="mode" value="remote">
          Remote
        </label>

        <label>
          <input type="radio" name="mode" value="hybrid">
          Hybrid
        </label>
      </fieldset>

      <fieldset>
        <legend>Technologies Known</legend>

        <label>
          <input type="checkbox" name="technology" value="html">
          HTML
        </label>

        <label>
          <input type="checkbox" name="technology" value="css">
          CSS
        </label>

        <label>
          <input type="checkbox" name="technology" value="javascript">
          JavaScript
        </label>
      </fieldset>

      <p>
        <label for="cv">Upload Resume (PDF):</label>
        <input type="file" id="cv" name="resume" accept=".pdf">
      </p>

      <p>
        <label for="cover">Cover Letter:</label>
        <br>
        <textarea id="cover" name="cover"
          rows="5" cols="40"
          placeholder="Write your cover letter here..."
          maxlength="500"></textarea>
      </p>

      <input type="hidden" name="source" value="careers-page">

      <p>
        <label>
          <input type="checkbox" name="agree" required>
          I confirm that the information is correct.
        </label>
      </p>

      <button type="submit">Apply Now</button>
      <button type="reset">Reset Form</button>
      <button type="button" onclick="window.print()">Print</button>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Job Application Form</p>
  </footer>

</body>
</html>
