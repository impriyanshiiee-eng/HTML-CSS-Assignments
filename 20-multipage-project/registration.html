
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student registration form for our website.">
    <title>Registration | Priyanshi's Website</title>
</head>

<body>

    <header>
        <h1>Student Registration</h1>

        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="registration.html">Registration</a> |
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Registration Form</h2>

            <form action="#" method="post">

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">
                <br><br>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob">
                <br><br>

                <label for="course">Select Course:</label>
                <select id="course" name="course">
                    <option value="">Choose a course</option>
                    <option value="BCA">BCA</option>
                    <option value="BCA AI">BCA Artificial Intelligence</option>
                    <option value="BBA">BBA</option>
                </select>
                <br><br>

                <p>Gender:</p>

                <input type="radio" id="male" name="gender" value="Male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>

                <br><br>

                <button type="submit">Register</button>
                <button type="reset">Reset</button>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Priyanshi. All rights reserved.</p>
    </footer>

</body>
</html>
